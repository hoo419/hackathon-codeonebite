<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>동아리 활동 기록 관리</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="school-badge">
    <img src="assets/mjc-logo.gif" alt="명지전문대학 로고">
    <span>명지전문대학</span>
  </div>

  <h1>동아리 활동 기록 관리</h1>

  <!-- 선택기능: JSON 내보내기/가져오기 (조영남 담당, features.js) -->
  <section id="io-section">
    <button id="export-btn">JSON 내보내기</button>
    <input type="file" id="import-input" accept="application/json">
  </section>

  <!-- 선택기능: 키워드 검색 (조영남 담당, features.js) -->
  <section id="search-section">
    <input type="text" id="search-input" placeholder="활동명 또는 장소로 검색">
  </section>

  <!-- 필수기능: 활동 등록 (임채호 담당, app.js) -->
  <section id="register-section">
    <h2>활동 등록</h2>
    <form id="register-form">
      <input type="text" id="title-input" placeholder="활동명" required>
      <input type="date" id="date-input" required>
      <input type="text" id="place-input" placeholder="장소">
      <input type="number" id="member-count-input" placeholder="참여 인원" min="1" step="1">
      <textarea id="memo-input" placeholder="메모"></textarea>
      <button type="submit">등록</button>
      <p id="register-error"></p>
    </form>
  </section>

  <!-- 필수기능: 활동 목록 조회/삭제 (임채호 담당, app.js) -->
  <section id="list-section">
  </section>

  <script src="app.js"></script>
  <script src="features.js"></script>
</body>
</html>
